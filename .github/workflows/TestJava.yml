# Runs ALL the unit tests (LoginTest, MessageTest, MessageManagerTest)
# every time code is pushed to any branch, or a pull request is opened to main.
# Results show under the repo's "Actions" tab: green tick = all tests passed.
name: Java CI

on:
  push:
    branches: [ "**" ]       # every branch, including feature branches
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B test
